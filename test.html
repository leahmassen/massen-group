<title>Form test</title>
</head>
<body style="font-family:Arial;max-width:480px;margin:40px auto;padding:0 20px">
<h1>Form test</h1>
<form action="https://formspree.io/f/xoedalnw" method="POST">

<button type="submit" style="width:100%;padding:14px;font-size:16px">Send test</button>
</form>
